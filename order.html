<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สั่งซื้อ — Body Scent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="index.html">Body Scent</a>
    <nav class="site-nav">
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">สินค้าทั้งหมด</a>
    </nav>
  </div>
</header>

<section class="section section--white">
  <div class="container">
    <div class="section-head">
      <h1>ยืนยันการสั่งซื้อ</h1>
      <p>กรอกข้อมูลของคุณให้ครบถ้วน ทีมงานจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
    </div>

    <form id="orderForm" class="form" novalidate>
      <div class="field">
        <label for="customerName">ชื่อลูกค้า</label>
        <input class="input" type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" required>
      </div>

      <div class="field">
        <label for="contact">เบอร์โทร / Line</label>
        <input class="input" type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์ หรือ Line ID" required>
      </div>

      <div class="field">
        <label for="items">รายการสินค้า</label>
        <input class="input" type="text" id="items" name="items" placeholder="รายการสินค้าที่สั่งซื้อ" required>
      </div>

      <div class="field">
        <label for="total">จำนวนเงินรวม (บาท)</label>
        <input class="input" type="text" id="total" name="total" placeholder="จำนวนเงินรวม" required>
      </div>

      <div class="field">
        <label for="note">หมายเหตุ</label>
        <textarea class="textarea" id="note" name="note" placeholder="ที่อยู่จัดส่ง หรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
      </div>

      <button class="btn btn--solid btn--block" type="submit">ยืนยันสั่งซื้อ</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <p>&copy; 2026 Body Scent</p>
    <p>น้ำหอมและโรลออนสำหรับทุกอารมณ์ของคุณ</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
